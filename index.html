<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COSMIC MARKETPLACE</title>
<meta name="description" content="EXPLORE BEYOND. SHOP BEYOND.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="app"><div id="boot">✦ COSMIC MARKETPLACE — กำลังโหลด / Loading...</div></div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#900;color:#fff;padding:12px">ต้องเปิดใช้งาน JavaScript / JavaScript is required</p></noscript>
<script>
/* ตัวช่วยวินิจฉัย: แสดงแถบสีแดงเมื่อสคริปต์พังหรือไฟล์หาย */
(function(){
  function show(msg){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#900;color:#fff;padding:10px;white-space:pre-wrap;font:13px monospace';
    d.textContent=msg;(document.body||document.documentElement).appendChild(d);
  }
  window.addEventListener('error',function(e){
    if(e.target&&e.target.tagName==='SCRIPT'){show('โหลดไฟล์ไม่สำเร็จ: '+(e.target.src||'')+'\nตรวจว่าไฟล์ script.js อยู่โฟลเดอร์เดียวกับ index.html');return;}
    if(e.target&&e.target.tagName==='LINK'){show('โหลดไฟล์ไม่สำเร็จ: style.css');return;}
    show('ERROR: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno+')');
  },true);
  window.addEventListener('unhandledrejection',function(e){show('ERROR (async): '+(e.reason&&e.reason.message||e.reason));});
})();
</script>
<script src="script.js"></script>
</body>
</html>
