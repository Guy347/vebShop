const cartItems=()=>cartArr().map(c=>({...c,p:prod(c.pid)}));
function calc(items,code,shipKey){const sub=items.reduce((s,i)=>s+unit(i.p)*i.qty,0);
 const pr=code&&DB.promos.find(x=>x.code===code&&x.active&&sub>=x.min);let disc=0,fs=false;
 if(pr){if(pr.type==='percent')disc=Math.round(sub*pr.value/100);else if(pr.type==='fixed')disc=Math.min(pr.value,sub);else fs=true}
 let ship=sub?DB.settings.ship[shipKey||'std']:0;if(fs||(shipKey||'std')==='std'&&sub-disc>=DB.settings.freeShip)ship=0;
 return{sub,disc,ship,total:Math.max(0,sub-disc+ship),pr}}
function canShop(){const u=U();if(u&&u.role!=='buyer'){toast(t('buyer_only'),'warn');return false}return true}
function addToCart(pid,q,ci,si){if(!canShop())return false;const p=prod(pid);if(!avail(p)||p.stock<1)return false;const id=[pid,ci,si].join('|'),c=cartArr(),x=c.find(i=>i.id===id);
 const n=(x?x.qty:0)+q;if(n>p.stock){toast(t('stock_short',{name:L(p.name)}),'err');return false}x?x.qty=n:c.push({id,pid,qty:q,ci,si,sel:true});save();updBadges();toast(t('added_cart'));return true}
function pushRecent(id){const r=rec(),i=r.indexOf(id);if(i>=0)r.splice(i,1);r.unshift(id);if(r.length>12)r.length=12;save()}

F.profile=f=>{const u=U(),d=fv(f),er={};['first','last','username','phone'].forEach(k=>{if(!(d[k]||'').trim())er[k]='v_req'});if(!er.username&&!/^[A-Za-z0-9_]{3,20}$/.test(d.username.trim()))er.username='v_user';if(!er.phone&&!/^\+?\d{8,15}$/.test(d.phone.replace(/[\s-]/g,'')))er.phone='v_phone';
 if(!er.username&&DB.users.some(x=>x.id!==u.id&&x.username.toLowerCase()===d.username.trim().toLowerCase()))er.username='userTaken';if(Object.keys(er).length)return showErrs(f,er);Object.assign(u,{first:d.first.trim(),last:d.last.trim(),username:d.username.trim(),phone:d.phone.trim()});save();toast(t('saved'));render()};
F.pw=f=>busy(f,async()=>{const u=U(),d=fv(f),er={};if(!d.cur)er.cur='v_req';if(d.nw.length<8)er.nw='v_pw8';if(d.cf!==d.nw)er.cf='v_match';if(Object.keys(er).length)return showErrs(f,er);const r=await Svc.auth.changePw(u,d.cur,d.nw);if(r.err)return showErrs(f,{cur:r.err});toast(t('pw_changed'));f.reset();showErrs(f,{})});
F.addr=f=>{const u=U(),d=fv(f),er={};['label','name','phone','line','city','zip'].forEach(k=>{if(!(d[k]||'').trim())er[k]='v_req'});if(Object.keys(er).length)return showErrs(f,er);
 const o={label:d.label.trim(),name:d.name.trim(),phone:d.phone.trim(),line:d.line.trim(),city:d.city.trim(),zip:d.zip.trim()},a=f.dataset.id&&u.addresses.find(x=>x.id===f.dataset.id);a?Object.assign(a,o):u.addresses.push({id:rid('a'),def:!u.addresses.length,...o});save();closeModal();render()};
F.review=f=>{const u=U();if(!u||u.role!=='buyer')return toast(t('buyer_only'),'err');const d=fv(f),pid=f.dataset.id,p=prod(pid),txt=(d.text||'').trim();if(txt.length<5)return showErrs(f,{text:'v_short'});if(DB.reviews.some(r=>r.pid===pid&&r.uid===u.id))return toast(t('rev_done'),'warn');
 DB.reviews.push({id:rid('r'),pid,uid:u.id,rating:Math.min(5,Math.max(1,+d.rating||5)),text:txt.slice(0,500),ts:Date.now(),hidden:false});notify(store(p.storeId).ownerId,'review_new',{name:p.name,stars:+d.rating||5});save();toast(t('saved'));render()};
F.checkout=f=>busy(f,async()=>{const u=U(),d=fv(f),er={};if(!d.c_name.trim())er.c_name='v_req';if(!/^\+?\d{8,15}$/.test(d.c_phone.replace(/[\s-]/g,'')))er.c_phone='v_phone';let addr;
 if(d.c_addr==='new'||!u.addresses.length){['n_line','n_city','n_zip'].forEach(k=>{if(!(d[k]||'').trim())er[k]='v_req'});addr={label:'New',line:(d.n_line||'').trim(),city:(d.n_city||'').trim(),zip:(d.n_zip||'').trim()}}else addr=u.addresses.find(a=>a.id===d.c_addr);
 if(Object.keys(er).length)return showErrs(f,er);showErrs(f,{});await sleep(600);addr={...addr,name:d.c_name.trim(),phone:d.c_phone.trim()};
 if(d.c_addr==='new'&&!u.addresses.length){u.addresses.push({id:rid('a'),def:true,...addr})}
 const r=Svc.orders.checkout(u,{addr,ship:['std','exp','warp'].includes(d.ship)?d.ship:'std',pay:d.pay});if(r.err)return showErrs(f,{_form:r.err==='stock_short'?null:r.err}),toast(r.err==='stock_short'?t('stock_short',{name:r.name}):t(r.err),'err');S.done=r.orders;go('done')});
F.prod=f=>{const s=myStore(),d=fv(f),er={};if(!d.name_th.trim())er.name_th='v_req';if(!d.name_en.trim())er.name_en='v_req';if(!(+d.price>0))er.price='v_num';if(!(d.disc===''||+d.disc>=0&&+d.disc<=90))er.disc='v_num';if(!(Number.isInteger(+d.stock)&&+d.stock>=0))er.stock='v_num';if(Object.keys(er).length)return showErrs(f,er);
 const old=f.dataset.id&&prod(f.dataset.id),list=x=>x.split(',').map(y=>y.trim()).filter(Boolean).slice(0,10);
 const data={name:{th:d.name_th.trim(),en:d.name_en.trim()},desc:{th:d.desc_th.trim(),en:d.desc_en.trim()},cat:cat(d.cat)?d.cat:DB.cats[0].id,price:Math.round(+d.price),disc:Math.round(+d.disc||0),stock:+d.stock,icon:EMO.includes(d.icon)?d.icon:'📦',g:Math.min(5,Math.max(0,+d.g||0)),status:d.status==='hidden'?'hidden':'active',colors:list(d.colors).map((n,i)=>({n,hex:COL[i%4].hex})),sizes:list(d.sizes),img:S.tmpImg!==undefined?S.tmpImg:(old?old.img:'')};
 if(Svc.catalog.save(s.id,data,f.dataset.id||null)){closeModal();toast(t('saved'));render()}};
F.storeset=f=>{const s=myStore(),d=fv(f),er={};if(!d.name.trim())er.name='v_req';if(d.email&&!EM.test(d.email.trim()))er.email='v_email';if(Object.keys(er).length)return showErrs(f,er);
 Object.assign(s,{name:d.name.trim(),logo:EMO.includes(d.logo)?d.logo:s.logo,cover:Math.min(5,Math.max(0,+d.cover||0)),desc:{th:d.desc_th.trim(),en:d.desc_en.trim()},address:d.address.trim(),email:d.email.trim(),phone:d.phone.trim(),social:d.social.trim()});if(S.tmpImg)s.logoImg=S.tmpImg;S.tmpImg=undefined;save();toast(t('saved'));render()};
F.cat=f=>{const d=fv(f),er={};if(!d.name_th.trim())er.name_th='v_req';if(!d.name_en.trim())er.name_en='v_req';if(Object.keys(er).length)return showErrs(f,er);const o={icon:EMO.includes(d.icon)?d.icon:'🌌',name:{th:d.name_th.trim(),en:d.name_en.trim()}},c=f.dataset.id&&cat(f.dataset.id);c?Object.assign(c,o):DB.cats.push({id:rid('c'),active:true,...o});save();closeModal();render()};
F.promo=f=>{const d=fv(f),er={},code=d.code.trim().toUpperCase();if(!/^[A-Z0-9]{3,16}$/.test(code))er.code='v_code';if(!(+d.value>=0))er.value='v_num';if(!(+d.min>=0))er.min='v_num';if(!er.code&&!f.dataset.id&&DB.promos.some(p=>p.code===code))er.code='userTaken';if(Object.keys(er).length)return showErrs(f,er);
 const o={code,type:['percent','fixed','ship'].includes(d.type)?d.type:'percent',value:Math.min(d.type==='percent'?100:1e6,+d.value),min:+d.min},p=f.dataset.id&&DB.promos.find(x=>x.code===f.dataset.id);p?Object.assign(p,o):DB.promos.push({active:true,used:0,...o});save();closeModal();render()};
F.banner=f=>{const d=fv(f),b=DB.banners.find(x=>x.id===f.dataset.id);if(!b)return;b.title={th:d.t_th.trim(),en:d.t_en.trim()};b.sub={th:d.s_th.trim(),en:d.s_en.trim()};save();closeModal();render()};
F.settings=f=>{const d=fv(f),er={};['std','exp','warp','free'].forEach(k=>{if(!(+d[k]>=0)||d[k]==='')er[k]='v_num'});if(Object.keys(er).length)return showErrs(f,er);const s=DB.settings;s.ship={std:+d.std,exp:+d.exp,warp:+d.warp};s.freeShip=+d.free;s.allowReg=!!d.allowReg;save();toast(t('saved'))};

/* ============ STARFIELD & INIT ============ */
function starfield(){const c=$('#stars'),x=c.getContext('2d');let W,H,ST=[],sh=null;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;ST=Array.from({length:Math.min(200,W*H/7000|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,s:Math.random()*.9+.2,p:Math.random()*6}))};rs();addEventListener('resize',rs);
 (function f(ts){x.clearRect(0,0,W,H);for(const s of ST){x.fillStyle=`rgba(200,220,255,${.35+.65*Math.abs(Math.sin(ts/1000*s.s+s.p))})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill();if(!reduce){s.y+=s.s*.08;if(s.y>H)s.y=0}}
  if(!reduce){if(!sh&&Math.random()<.003)sh={x:Math.random()*W,y:Math.random()*H*.5,l:0};if(sh){sh.l+=1;sh.x+=9;sh.y+=4;x.strokeStyle='rgba(34,211,238,'+(1-sh.l/40)+')';x.lineWidth=2;x.beginPath();x.moveTo(sh.x,sh.y);x.lineTo(sh.x-70,sh.y-31);x.stroke();if(sh.l>40)sh=null}}
  requestAnimationFrame(f)})(0)}
async function init(){
 try{DB=load();if(!DB){DB=await seed();save()}}catch(e){console.error(e);DB=await seed()}
 ['sessions','newsletter','loginHistory'].forEach(k=>DB[k]=DB[k]||[]);
 document.documentElement.lang=lang;starfield();addEventListener('hashchange',render);
 addEventListener('storage',e=>{if(e.key===KEY){const d=load();if(d){DB=d;render()}}});
 setInterval(tick,1000);render()}
init();
</script>
